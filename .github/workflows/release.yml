name: Build skill zip

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate skill zip
        run: bash scripts/build-skill-zip.sh

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: houheixue-advisor-skill
          path: dist/houheixue-advisor.zip

      - name: Attach zip to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 在網頁上建立 Release 時 release 已存在，只需附上 zip；直接推 tag 時則新建 release
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/houheixue-advisor.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/houheixue-advisor.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
