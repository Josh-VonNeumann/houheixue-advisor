name: Build skill zip

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate skill zip
        run: bash scripts/build-skill-zip.sh

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: houheixue-advisor-skill
          path: dist/houheixue-advisor.zip

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/houheixue-advisor.zip --title "$GITHUB_REF_NAME" --generate-notes
